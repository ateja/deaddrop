name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (core + C ABI)
        run: cargo test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python wheel + tests
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pip install "maturin>=1.7,<2" pytest
          cd crates/deaddrop-py
          maturin develop --release
          python -m pytest tests -q
      - name: Samples demo (Python publisher -> C++ listener)
        shell: bash
        run: |
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          samples/run_demo.sh 5
      - name: Latency sample
        run: cargo run --release --example latency -p deaddrop -- 1000

  # Follows "Run the samples (from a fresh clone)" in README.md command for
  # command, so the documented steps stay correct on every OS.
  readme-quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Steps 3-5 (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install ./crates/deaddrop-py
          python -c "import deaddrop_ipc; print(deaddrop_ipc.__version__)"
          cargo build --release -p deaddrop-ffi
          cmake -S samples/cpp_listener -B samples/cpp_listener/build -DCMAKE_BUILD_TYPE=Release
          cmake --build samples/cpp_listener/build --config Release
          samples/cpp_listener/build/listener --count 3 --timeout 60 &
          LISTENER=$!
          sleep 1
          python samples/python_publisher/publisher.py --count 3 --interval 0.2
          wait $LISTENER
      - name: Steps 3-5 (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          py -m venv .venv
          .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install ./crates/deaddrop-py
          python -c "import deaddrop_ipc; print(deaddrop_ipc.__version__)"
          cargo build --release -p deaddrop-ffi
          cmake -S samples/cpp_listener -B samples/cpp_listener/build -DCMAKE_BUILD_TYPE=Release
          cmake --build samples/cpp_listener/build --config Release
          $listener = Start-Process -FilePath samples\cpp_listener\build\Release\listener.exe `
            -ArgumentList '--count', '3', '--timeout', '60' -NoNewWindow -PassThru
          $null = $listener.Handle   # keep a handle so ExitCode is available
          Start-Sleep -Seconds 1
          python samples/python_publisher/publisher.py --count 3 --interval 0.2
          $listener.WaitForExit()
          if ($listener.ExitCode -ne 0) { throw "listener exited with $($listener.ExitCode)" }

  wheels:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
          - os: ubuntu-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/deaddrop-py
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: crates/deaddrop-py/dist/*.whl
